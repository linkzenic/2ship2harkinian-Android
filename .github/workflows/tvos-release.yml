name: Build unsigned tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [platform-integration]

permissions:
  contents: read

concurrency:
  group: tvos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEPLOYMENT_TARGET: '15.0'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Show build tools
        run: |
          xcodebuild -version
          cmake --version

      - name: Install archive generator prerequisite
        run: brew install sdl2 glew libzip nlohmann-json tinyxml2 spdlog

      - name: Generate and build unsigned Apple TV app
        run: |
          cmake -S . -B build-asset-generator -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CROWD_CONTROL=OFF \
            -DBUILD_ARCHIVE_GENERATOR_ONLY=ON \
            -DINCLUDE_MPQ_SUPPORT=OFF \
            -DFETCHCONTENT_QUIET=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix glew);$(brew --prefix libzip);$(brew --prefix nlohmann-json);$(brew --prefix tinyxml2);$(brew --prefix spdlog)" \
            -DGLEW_ROOT="$(brew --prefix glew)"
          cmake --build build-asset-generator --target Generate2ShipOtr --parallel 2
          test -s mm/2ship.o2r
          TWO_SHIP_O2R_PATH="$GITHUB_WORKSPACE/mm/2ship.o2r" scripts/build-ios.sh --tvos-device

      - name: Package unsigned Apple TV IPA
        run: |
          scripts/package-ios-unsigned.sh \
            "build-tvos-device/mm/Release-appletvos/2Ship 2 Harkinian.app" \
            "dist/2Ship-2-Harkinian-tvOS-unsigned.ipa"

      - name: Verify public artifact
        run: |
          set -euo pipefail
          test -f dist/2Ship-2-Harkinian-tvOS-unsigned.ipa
          entries="$(unzip -Z1 dist/2Ship-2-Harkinian-tvOS-unsigned.ipa)"
          grep -F '/2ship.o2r' <<< "$entries" >/dev/null
          if grep -Eq '(_CodeSignature|embedded\.mobileprovision|/mm\.o2r$)' <<< "$entries"; then
            echo "Unexpected signing or game data found in the artifact."
            exit 1
          fi
          # The packaging script scans uncompressed files for local user paths.

      - uses: actions/upload-artifact@v4
        with:
          name: 2Ship-2-Harkinian-tvOS-unsigned
          path: dist/2Ship-2-Harkinian-tvOS-unsigned.ipa
          if-no-files-found: error
