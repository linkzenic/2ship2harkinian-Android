def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
def repoRoot = rootProject.projectDir.parentFile
def androidVcpkgRoot = System.getenv("VCPKG_ROOT") ?: new File(repoRoot, "build/vcpkg").absolutePath
def androidVcpkgRootArg = androidVcpkgRoot.replace('\\', '/')
def androidAppVersionCode = 5001010
def androidAppVersionName = "5.0.1-android.1"
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    buildFeatures {
        buildConfig true
    }
    ndkVersion "26.0.10792818"
    compileSdkVersion 33
    defaultConfig {
        if (buildAsApplication) {
            applicationId project.findProperty('twoShipApplicationId') ?: "com.twoshipfork.mm"
            namespace("com.twoshipfork.mm")
        }
        minSdkVersion 24
        targetSdkVersion 33
        versionCode androidAppVersionCode
        versionName androidAppVersionName
        externalNativeBuild {
            //ndkBuild {
            //    arguments "APP_PLATFORM=android-23"
            //    abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //}
            cmake {
                 arguments "-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",'-DUSE_OPENGLES=ON', "-DPNG_SHARED=OFF", "-DPNG_STATIC=ON", "-DPNG_TESTS=OFF", "-DANDROID_VCPKG_ROOT=${androidVcpkgRootArg}", "-DANDROID_APP_VERSION_NAME=${androidAppVersionName}"
                 abiFilters 'arm64-v8a'
            }
        }
    }
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}", "verifyBundledAssets")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
                 version "3.30.3"
            }
        }

    }
    lintOptions {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

tasks.register("verifyBundledAssets") {
    def bundled2ShipOtr = file("src/main/assets/2ship.o2r")
    def bundledRomOtr = file("src/main/assets/mm.o2r")
    inputs.file(bundled2ShipOtr).optional()

    doLast {
        if (!bundled2ShipOtr.exists()) {
            throw new GradleException("Missing src/main/assets/2ship.o2r. Generate the no-ROM support archive before building the APK.")
        }
        if (bundledRomOtr.exists()) {
            throw new GradleException("src/main/assets/mm.o2r must not be bundled. It is generated on-device from the user's own game file.")
        }
    }
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.3.2'
}

task prepareKotlinBuildScriptModel {
}
